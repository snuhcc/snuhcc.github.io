name: Sync Publications

on:
  schedule:
    - cron: "0 2 1 * *" # 매월 1일 오전 2시 (UTC)
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write
  actions: write # deploy.yml 을 workflow_dispatch 로 실행하기 위해 필요

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch publications from OpenAlex
        env:
          # Optional but recommended: a free OpenAlex API key removes the
          # anonymous rate limit (429). Register at https://openalex.org/rest-api
          # and add it as a repository secret named OPENALEX_API_KEY.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: node scripts/fetch-publications.mjs

      - name: Verify static export build
        run: npm run build

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No publication changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: update publications data"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # site would otherwise stay stale until a human pushes something.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
