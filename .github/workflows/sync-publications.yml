name: Sync Publications

on:
  schedule:
    - cron: "0 2 * * 1" # 매주 월요일 오전 2시 (UTC)
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch publications from OpenAlex
        run: node scripts/fetch-publications.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          git diff --cached --quiet || git commit -m "sync: update publications from OpenAlex"
          git push
