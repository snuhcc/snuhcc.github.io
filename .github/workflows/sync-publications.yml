name: Sync Publications

on:
  schedule:
    - cron: "0 2 1 * *" # 매월 1일 오전 2시 (UTC)
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch publications from OpenAlex
        run: node scripts/fetch-publications.mjs

      - name: Verify static export build
        run: npm run build

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "sync: update publications"
          git push origin HEAD:master
